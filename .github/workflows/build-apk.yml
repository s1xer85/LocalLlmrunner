name: Nexias LLMs - Build APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK packages
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 5. Find Android project automatically
      - name: Detect Android project
        id: project
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          find . -maxdepth 5 -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            -not -path "./.git/*" \
            -print

          echo ""
          echo "Searching for Android Gradle project..."

          SETTINGS_FILE=$(find . \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            echo ""
            echo "Repository tree:"
            find . -maxdepth 4 -type f \
              -not -path "./.git/*" \
              | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR="${PROJECT_DIR#./}"
          fi

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 6. Verify Android project
      - name: Verify project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "ERROR: root build.gradle(.kts) not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) not found."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo ""
          echo "Project verification successful."

      # 7. Setup Gradle
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 8. Show Gradle information
      - name: Check Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --version

      # 9. Clean project
      - name: Clean project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace

      # 10. Build APK
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 11. Find APK
      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find app/build/outputs \
              -type f 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      # 12. Prepare APK
      - name: Prepare APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "${{ steps.apk.outputs.path }}" \
            "release/Nexias-LLMs-debug.apk"

          echo ""
          echo "Final APK:"
          ls -lh release/Nexias-LLMs-debug.apk

      # 13. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexias-LLMs-APK
          path: ${{ steps.project.outputs.dir }}/release/Nexias-LLMs-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 14. Build summary
      - name: Build summary
        if: success()
        run: |
          echo "## ✅ Nexias LLMs APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**APK:** Nexias-LLMs-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build:** Debug" >> "$GITHUB_STEP_SUMMARY"
          echo "**Java:** 17" >> "$GITHUB_STEP_SUMMARY"
          echo "**Gradle:** 8.7" >> "$GITHUB_STEP_SUMMARY"
          echo "**Android SDK:** 34" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from Artifacts." >> "$GITHUB_STEP_SUMMARY"
