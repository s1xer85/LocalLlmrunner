name: Nexias LLMs - Build APK from ZIP

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nexias LLMs APK
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Get GitHub repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Java 17
      # ----------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ----------------------------------------
      # 3. Android SDK
      # ----------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # ----------------------------------------
      # 4. Install Android SDK 34
      # ----------------------------------------
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Android SDK installed."


      # ----------------------------------------
      # 5. Find nexias-llms.zip
      # ----------------------------------------
      - name: Find Nexias ZIP
        id: zip
        shell: bash
        run: |
          set -e

          echo "Searching for nexias-llms.zip..."

          ZIP_FILE=$(find . \
            -type f \
            -iname "nexias-llms.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: nexias-llms.zip was not found."
            echo ""
            echo "ZIP files found in repository:"
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -print

            exit 1
          fi

          echo ""
          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # 6. Extract ZIP
      # ----------------------------------------
      - name: Extract Nexias project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          echo "Extracting:"
          echo "${{ steps.zip.outputs.zip }}"

          unzip -q "${{ steps.zip.outputs.zip }}" \
            -d android-project

          echo ""
          echo "Extraction complete."

          echo ""
          echo "Extracted files:"
          find android-project \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -n 200


      # ----------------------------------------
      # 7. Find Android Gradle project
      # ----------------------------------------
      - name: Detect Android project
        id: project
        shell: bash
        run: |
          set -e

          echo "Searching for settings.gradle..."

          SETTINGS_FILE=$(find android-project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "Files inside ZIP:"
            find android-project \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # 8. Verify project
      # ----------------------------------------
      - name: Verify Android project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          echo "Checking project..."

          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] && \
             [ ! -f "build.gradle" ]; then
            echo "ERROR: root build.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && \
             [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) missing."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          fi

          echo ""
          echo "================================"
          echo "Android project verified!"
          echo "================================"


      # ----------------------------------------
      # 9. Install Gradle 8.7
      # ----------------------------------------
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ----------------------------------------
      # 10. Check Gradle
      # ----------------------------------------
      - name: Check Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --version


      # ----------------------------------------
      # 11. Clean
      # ----------------------------------------
      - name: Clean project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace


      # ----------------------------------------
      # 12. Build APK
      # ----------------------------------------
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ----------------------------------------
      # 13. Find APK
      # ----------------------------------------
      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build outputs:"
            find app/build/outputs \
              -type f 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK generated:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # 14. Prepare APK
      # ----------------------------------------
      - name: Prepare APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "${{ steps.apk.outputs.path }}" \
            "release/Nexias-LLMs-debug.apk"

          echo ""
          echo "================================"
          echo "FINAL APK"
          echo "================================"

          ls -lh release/Nexias-LLMs-debug.apk


      # ----------------------------------------
      # 15. Upload APK
      # ----------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexias-LLMs-APK
          path: ${{ steps.project.outputs.dir }}/release/Nexias-LLMs-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ----------------------------------------
      # 16. Success message
      # ----------------------------------------
      - name: Build summary
        if: success()
        run: |
          echo "## ✅ Nexias LLMs APK Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The APK was successfully built from nexias-llms.zip." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**APK:** Nexias-LLMs-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "**Java:** 17" >> "$GITHUB_STEP_SUMMARY"
          echo "**Gradle:** 8.7" >> "$GITHUB_STEP_SUMMARY"
          echo "**Android SDK:** 34" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from the workflow Artifacts section." >> "$GITHUB_STEP_SUMMARY"
